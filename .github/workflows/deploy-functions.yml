# Deploy Cloud Functions from a button in the GitHub web UI.
#
# Exists because Cloud Functions cannot be deployed from the Firebase Console,
# and both Cloud Shell (blocked by Workspace policy) and a local CLI were off
# the table. The firebase CLI still runs — it just runs here, on GitHub's
# machines, so deploying is a click rather than a terminal session.
#
# Run it: repo → Actions → "Deploy Cloud Functions" → Run workflow.
#
# Two targets (input "target"):
#   servitec-dev-586f6       development/testing project — the default, and
#                            where unreleased flows go first. Functions,
#                            Firestore rules + indexes and Storage rules are
#                            all deployed together, so dev never drifts.
#   servicios-domicilio-mvp  production, which the user test runs on. Functions
#                            only (rules stay a manual console step there), and
#                            only when "confirm_production" is typed as
#                            PRODUCCION. While the user test is running, deploy
#                            production from the user-test-1 branch, never main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT      service account key JSON for production
#   FIREBASE_SERVICE_ACCOUNT_DEV  service account key JSON for servitec-dev-586f6
#   STRIPE_WEBHOOK_SECRET_DEV     whsec_... of the webhook pointing at dev
#   STRIPE_SECRET_KEY             sk_test_... / sk_live_...
#   STRIPE_WEBHOOK_SECRET         whsec_... (leave empty on the first run)
#   STRIPE_PLATFORM_ACCOUNT_ID    acct_...
#   FACTURAPI_API_KEY             sk_test_... / sk_live_...
#   FACTURAPI_SERVITEC_ORG_ID     FacturAPI parent organization id
#   ADMIN_EMAIL                   admin login email, provisioned on deploy
#   ADMIN_PASSWORD                its password (min 6 chars). Changing this
#                                 secret and redeploying resets the password.
#                                 Both optional — if unset, provisioning is
#                                 skipped and the deploy still succeeds.
#
# Deliberately manual (workflow_dispatch only). Deploying on every push to main
# would ship half-finished work to a live payment system.

name: Deploy Cloud Functions

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Firebase project to deploy to'
        type: choice
        options:
          - servitec-dev-586f6
          - servicios-domicilio-mvp
        default: servitec-dev-586f6
      confirm_production:
        description: 'Only for production: type PRODUCCION to confirm'
        required: false
        default: ''
      only:
        description: 'Limit the deploy, e.g. functions:onPaymentSucceededStripeWebhook. Leave as "functions" to deploy all.'
        required: false
        default: 'functions'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      IS_DEV: ${{ inputs.target == 'servitec-dev-586f6' }}

    steps:
      - name: Guard production deploys
        # A slip of the dropdown must not ship unreleased flows to the server
        # real users are on.
        if: inputs.target == 'servicios-domicilio-mvp'
        run: |
          if [ "${{ inputs.confirm_production }}" != "PRODUCCION" ]; then
            echo "::error::Deploying to production requires typing PRODUCCION in confirm_production."
            exit 1
          fi
          echo "Deploying ${GITHUB_REF_NAME} to PRODUCTION."

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Compile TypeScript
        working-directory: functions
        run: npm run build

      - name: Write functions/.env from repository secrets
        # The Firebase CLI reads this file and uploads each value as a runtime
        # environment variable on the deployed functions. It is created here and
        # discarded with the runner — never committed.
        run: |
          cat > functions/.env <<EOF
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ inputs.target == 'servitec-dev-586f6' && secrets.STRIPE_WEBHOOK_SECRET_DEV || secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PLATFORM_ACCOUNT_ID=${{ secrets.STRIPE_PLATFORM_ACCOUNT_ID }}
          FACTURAPI_API_KEY=${{ secrets.FACTURAPI_API_KEY }}
          FACTURAPI_SERVITEC_ORG_ID=${{ secrets.FACTURAPI_SERVITEC_ORG_ID }}
          PLATFORM_COMMISSION_PCT=12
          EOF

      - name: Fail early if the Stripe key is missing
        # Without this the deploy "succeeds" and every payment fails at runtime,
        # which is a much more confusing thing to debug.
        run: |
          if ! grep -q '^STRIPE_SECRET_KEY=sk_' functions/.env; then
            echo "::error::STRIPE_SECRET_KEY secret is missing or malformed."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if ! grep -q '^FACTURAPI_API_KEY=sk_' functions/.env; then
            echo "::error::FACTURAPI_API_KEY secret is missing or malformed."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        run: |
          echo '${{ inputs.target == 'servitec-dev-586f6' && secrets.FIREBASE_SERVICE_ACCOUNT_DEV || secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/gcp-key.json"
          if ! grep -q '"type": *"service_account"' "$RUNNER_TEMP/gcp-key.json"; then
            echo "::error::No service account key for $TARGET. Add the FIREBASE_SERVICE_ACCOUNT(_DEV) secret."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy
        # --force auto-confirms deleting the three legacy placeholder functions
        # (sendAdvancedNotification, generateMonthlyReport, cleanupExpiredServices)
        # that the old servitec_app/functions codebase left behind. There is no
        # prompt to answer on a runner.
        #
        # On dev, a plain "functions" deploy also ships Firestore rules and
        # indexes and Storage rules, so the dev project always matches the
        # branch being tested. --force there may delete indexes not declared
        # in firestore.indexes.json, which is the point on a dev project.
        run: |
          set -o pipefail
          ONLY="${{ inputs.only }}"
          if [ "$IS_DEV" = "true" ] && [ "$ONLY" = "functions" ]; then
            ONLY="functions,firestore,storage"
          fi
          echo "Deploying --only $ONLY to $TARGET"
          npx firebase-tools@15 deploy \
            --only "$ONLY" \
            --project "$TARGET" \
            --non-interactive \
            --force 2>&1 | tee deploy.log

      - name: Fail if any function failed to create
        # The CLI has exited 0 on a run where four of ten functions failed —
        # a green tick on a partial deploy is worse than a red one, because
        # nobody goes looking. Re-read the log and fail explicitly.
        run: |
          if grep -qE '^(Failed to (create|update) function|.*failed to (create|update) function)' deploy.log; then
            echo "::error::Some functions did not deploy. Failures:"
            grep -E 'Failed to (create|update) function' deploy.log || true
            echo ""
            echo "On a first 2nd-gen deploy this is usually the Eventarc/Cloud Run"
            echo "service agents still provisioning — wait a few minutes and re-run."
            exit 1
          fi
          echo "All requested functions deployed."

      - name: Provision the admin account
        # Admin accounts cannot be created from the app: firestore.rules forbid
        # a client from ever writing rol: 'admin' on its own document. This step
        # creates (or realigns) the one admin login using the Admin SDK, which
        # bypasses rules legitimately. Idempotent — safe on every deploy.
        #
        # Lives under functions/ because Node resolves `require` from the
        # script's own directory upward — not from the working directory — so a
        # script at the repo root could not see functions/node_modules, where
        # `npm ci` above installs firebase-admin. Reuses
        # GOOGLE_APPLICATION_CREDENTIALS from the auth step.
        working-directory: functions
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/seed-admin.js

      - name: Claim phone numbers of existing accounts
        # Registration enforces one account per phone through telefonos/{phone}.
        # Accounts older than that rule have no claim; this creates them.
        # Idempotent, never edits users. See the script header.
        working-directory: functions
        run: node scripts/backfill-phone-claims.js

      - name: Show the deployed function URLs
        if: success()
        run: |
          npx firebase-tools@15 functions:list \
            --project "$TARGET" || true
          echo "----------------------------------------------------------------"
          echo "Stripe webhook endpoint to register in the Stripe dashboard:"
          echo "https://us-central1-$TARGET.cloudfunctions.net/onPaymentSucceededStripeWebhook"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json" functions/.env
